<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="stylesheet" href="%PUBLIC_URL%/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,300;1,400;1,600;1,700;1,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="%PUBLIC_URL%/bootstrap-4.3.1-dist/css/bootstrap.min.css" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons&display=swap" rel="stylesheet" />
    <script>
      (function() {
        fetch('/api/pgcore/rest-api/banner')
          .then(res => res.json())
          .then(data => {
            if (data && data.length > 0) {
              var isMobile = window.innerWidth <= 768;
              var bannerUrl = isMobile && data[0].thumbUrl ? data[0].thumbUrl : data[0].fileUrl;
              if (bannerUrl) {
                var link = document.createElement('link');
                link.rel = 'preload';
                link.as = 'image';
                link.fetchPriority = 'high';
                link.href = bannerUrl;
                document.head.appendChild(link);
              }
            }
          })
          .catch(e => {});
      })();
    </script>
    <title>KENDRICK HELLER</title>
    <meta
      name="keywords"
      content="fashion, clothing, menswear, t-shirt"
    />
    <meta
      id="meta-description"
      name="description"
      content="Kendrick Hellerb - Define your own style."
    />
    <meta id="meta-facebook" property="fb:app_id" content="8604505612894619" />
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <style>
        .skeleton-header-top { background: black; height: 30px; width: 100%; }
        .skeleton-header-mid { background: white; height: 68px; width: 100%; display: flex; align-items: center; justify-content: center; box-shadow: grey 0px 0px 6px 1px; position: relative; z-index: 2; }
        .skeleton-logo { width: 180px; height: 42px; background: #f0f0f0; border-radius: 4px; }
        .skeleton-banner { width: 100%; aspect-ratio: 4/1; background: #f0f0f0; }
        .skeleton-categories { display: flex; justify-content: center; gap: 10px; padding: 10px; min-height: 120px; overflow: hidden; }
        .skeleton-cat { width: 75px; height: 75px; border-radius: 50%; background: #f0f0f0; flex-shrink: 0; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .skeleton-anim { animation: pulse 1.5s infinite; }
      </style>
      <div class="skeleton-header-top"></div>
      <div class="skeleton-header-mid"><div class="skeleton-logo skeleton-anim"></div></div>
      <div class="skeleton-banner skeleton-anim"></div>
      <div class="skeleton-categories">
        <div class="skeleton-cat skeleton-anim"></div>
        <div class="skeleton-cat skeleton-anim"></div>
        <div class="skeleton-cat skeleton-anim"></div>
        <div class="skeleton-cat skeleton-anim"></div>
      </div>
    </div>
    <script src="%PUBLIC_URL%/jquery/jquery-3.6.0.min.js" defer></script>
    <script src="%PUBLIC_URL%/bootstrap-4.3.1-dist/js/bootstrap.min.js" defer></script>
  </body>
</html>
